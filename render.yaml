services:
  - type: web
    name: pixelhunter
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --ws websockets --proxy-headers
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Render injects RENDER_GIT_COMMIT; the footer shows it automatically.
      - key: PYTHONUNBUFFERED
        value: "1"
